name = "Update CNAME record"
zone = "test.example.com"
domain = "cn.test.example.com"
ttl = 900
comments = "This is a comment for the CNAME record update."
expiry_ttl = 7200
response = '''{
    "response": {
        "zone": {
            "name": "test.example.com",
            "type": "Primary",
            "internal": false,
            "dnssecStatus": "SignedWithNSEC",
            "disabled": false
        },
        "updatedRecord": {
            "disabled": false,
            "name": "cn.test.example.com",
            "type": "CNAME",
            "ttl": 900,
            "rData": {
                "cname": "cn-raw.example.com"
            },
            "dnssecStatus": "Unknown",
            "lastUsedOn": "0001-01-01T00:00:00"
        }
    },
    "status": "ok"
}
'''

[command.CNAME]
cname = "cn-raw.example.com"
