[package]
name = "tdns"
version = "0.2.19"
edition = "2024"
repository = "https://github.com/organicveggie/tdns-cli"
description = "CLI tool for Technitium DNS server."
license = "GPL-3.0-or-later"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.60", features = ["derive", "wrap_help"] }
mockall = "0.14.0"
mockito = "1.7.2"
pretty_assertions = "1.4.1"
reqwest = { version = "0.13.2", features = ["json", "query"] }
rstest = "0.26.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
tabled = "0.20.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
