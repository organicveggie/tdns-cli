name: Release Docker Image
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/arm/v7
          - linux/arm64/v8
          - linux/amd64
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version_tag
        run: |
          echo ${{ github.event.ref }} | \
            sed -E 's/^refs\/tags\///g' | \
            sed -E 's/(.+\/)?v([0-9]+[.][0-9]+[.][0-9]+)/version=\2/g' >> ${GITHUB_OUTPUT}
          echo ${{ github.event.ref }} | \
            sed -E 's/^refs\/tags\///g' | \
            sed -E 's/(.+\/)?v([0-9]+)([.][0-9]+[.][0-9]+)/ver_major=\2/g' >> ${GITHUB_OUTPUT}
          echo ${{ github.event.ref }} | \
            sed -E 's/^refs\/tags\///g' | \
            sed -E 's/(.+\/)?v([0-9]+)([.][0-9]+)([.][0-9]+)/ver_minor=\3/g' >> ${GITHUB_OUTPUT}
          echo ${{ github.event.ref }} | \
            sed -E 's/^refs\/tags\///g' | \
            sed -E 's/(.+\/)?v([0-9]+)([.][0-9]+)([.][0-9]+)/ver_patch=\4/g' >> ${GITHUB_OUTPUT}

      - name: Build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags:
            - localhost:5000/organicveggie/tdns-cli-rs:latest
            - localhost:5000/organicveggie/tdns-cli-rs:${{ steps.version_tag.ouputs.version }}
            - localhost:5000/organicveggie/tdns-cli-rs:${{ steps.version_tag.ouputs.ver_major }}-latest
          platforms: ${{ matrix.platform }}

      - name: Inspect
        run: |
          docker buildx imagetools inspect localhost:5000/organicveggie/tdns-cli-rs:latest
          docker buildx imagetools inspect localhost:5000/organicveggie/tdns-cli-rs:${{ steps.version_tag.ouputs.version }}
          docker buildx imagetools inspect localhost:5000/organicveggie/tdns-cli-rs:${{ steps.version_tag.ouputs.ver_major }}-latest
